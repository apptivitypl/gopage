name: Feature request
description: Something gopage should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to build, and where gopage got in the way. Describe the situation rather than the feature.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, if there is one, and what it costs.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: Optional. Template syntax, a config key, a command.
      render: text
