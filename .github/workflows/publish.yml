name: publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: auto
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      released: ${{ steps.plan.outputs.released }}
      npm: ${{ steps.plan.outputs.npm }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Read the manifest and ask the registries
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/rilltool release plan | tee -a "$GITHUB_STEP_SUMMARY"
          go run ./cmd/rilltool release plan --json > plan.json
          tag="v$(go run ./cmd/rilltool version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "packages<<PLAN"
            cat plan.json
            echo "PLAN"
          } >> "$GITHUB_OUTPUT"
          python3 - <<'KINDS' >> "$GITHUB_OUTPUT"
          import json
          kinds = {p["kind"] for p in json.load(open("plan.json"))}
          print("npm=" + str("npm" in kinds).lower())
          KINDS

  tag:
    name: tag
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Tag every go package
        env:
          PLAN: ${{ needs.plan.outputs.packages }}
        run: |
          printf '%s' "$PLAN" |
            python3 -c 'import json,sys; [print(p["tag"]) for p in json.load(sys.stdin) if p["kind"] == "go"]' |
            while read -r tag; do
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "$tag is already tagged" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              git tag "$tag"
              git push origin "$tag"
              echo "pushed $tag" >> "$GITHUB_STEP_SUMMARY"
            done

  release:
    name: release
    needs: [plan, tag]
    if: needs.plan.outputs.released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: The tag has to match the manifest
        run: go run ./cmd/rilltool version --check "$TAG"

      - name: Install the pinned linter
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Run every gate
        run: go run ./cmd/rilltool ci

      - name: Install cosign, which goreleaser signs with
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.5

      - name: Install the SBOM generator goreleaser expects
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.51.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.plan.outputs.tag }}

      - name: Attest everything the release publishes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt

  npm:
    name: npm
    needs: [plan, tag, release]
    if: >-
      always() && needs.plan.outputs.npm == 'true' &&
      needs.tag.result == 'success' && needs.release.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install the browser packages
        run: pnpm --dir examples/hello-world install --no-frozen-lockfile

      - name: Download the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir archives --pattern 'rill_*'

      - name: Publish
        env:
          PLAN: ${{ needs.plan.outputs.packages }}
        run: |
          names=$(printf '%s' "$PLAN" |
            python3 -c 'import json,sys; [print(p["name"]) for p in json.load(sys.stdin) if p["kind"] == "npm"]')
          for name in $names; do
            go run ./cmd/rilltool release run "$name" --from archives --publish
            echo "published $name" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Configure trusted publishers
        if: env.NODE_AUTH_TOKEN != ''
        run: go run ./cmd/rilltool release trust

  tags:
    name: tags
    needs: [plan, npm]
    if: always() && needs.npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Tag every published package
        run: |
          go run ./cmd/rilltool release tags | while read -r tag; do
            git tag "$tag"
            git push origin "$tag"
            echo "pushed $tag" >> "$GITHUB_STEP_SUMMARY"
          done
