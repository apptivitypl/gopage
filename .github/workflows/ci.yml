name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: auto
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate the caches
        id: caches
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Reuse what was compiled before
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.caches.outputs.build }}
            ${{ steps.caches.outputs.modules }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Install the pinned linter
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Run every gate
        run: go run ./cmd/gopagetool ci

      - name: Hold the coverage of what this change touched
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/gopagetool coverage --ci --diff-base "$BASE"

      - name: Compare against the performance log
        run: go run ./cmd/gopagetool bench --check

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: .coverage/coverage.html
          if-no-files-found: warn

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate the caches
        id: caches
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Reuse what was compiled before
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.caches.outputs.build }}
            ${{ steps.caches.outputs.modules }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - run: go test ./...

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go test ./... -race -count=1

  invariants:
    name: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run the invariants that hold both targets to one answer
        run: go test ./internal/invariant/ -race -count=1 -v

  cross:
    name: cross (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, packages: ./... }
          - { goos: linux, goarch: arm64, packages: ./... }
          - { goos: darwin, goarch: amd64, packages: ./... }
          - { goos: darwin, goarch: arm64, packages: ./... }
          - { goos: windows, goarch: amd64, packages: ./... }
          - { goos: windows, goarch: arm64, packages: ./... }
          - { goos: js, goarch: wasm, packages: . }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Compile for this target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ${{ matrix.packages }}

  client:
    name: client runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: deploy smoke, flag: --record }
          - { name: reference application, flag: --reference }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build a project and probe what it answers
        run: PATH="$PWD/node_modules/.bin:$PATH" go run ./cmd/gopagetool smoke ${{ matrix.flag }}

  example:
    name: committed examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Keep the downloaded binary between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gopage
          key: gopage-tools-${{ runner.os }}-${{ hashFiles('internal/css/css.go', 'internal/gotoolchain/gotoolchain.go') }}
          restore-keys: |
            gopage-tools-${{ runner.os }}-

      - name: Compare the examples with the templates
        run: go run ./cmd/gopagetool example

      - run: pnpm --dir examples/hello-world install --no-frozen-lockfile

      - name: Build the examples the way someone outside this repo does
        run: go run ./cmd/gopagetool example --verify

      - name: Point the examples at this checkout
        run: go run ./cmd/gopagetool example --workspace

      - name: Build the examples and probe the wasm demo
        run: |
          go run ./cmd/gopage build --dir examples/blog
          go run ./cmd/gopage build --dir examples/hello-world --target demo
          PORT=3123 node examples/hello-world/dist/demo/server.mjs &
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:3123/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3123/api/health | grep -q '"runtime":"go"'
          curl -fsS -o /dev/null http://127.0.0.1:3123/

  tailwind:
    name: tailwind stylesheet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Keep the downloaded binary between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gopage
          key: gopage-tools-${{ runner.os }}-${{ hashFiles('internal/css/css.go', 'internal/gotoolchain/gotoolchain.go') }}
          restore-keys: |
            gopage-tools-${{ runner.os }}-

      - run: go run ./cmd/gopage css install

      - name: Build the starter with tailwind
        run: |
          go run ./cmd/gopage new "$RUNNER_TEMP/starter" --module example.com/demo --gopage-path "$PWD" --css tailwind --yes
          go run ./cmd/gopage build --dir "$RUNNER_TEMP/starter"

      - name: Check the stylesheet for the classes the compiler found
        run: grep -q 'max-w-3xl' "$RUNNER_TEMP"/starter/dist/assets/assets/app.*.css

  workflows:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: v1.29.0
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
