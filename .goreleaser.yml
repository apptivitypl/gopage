version: 2

project_name: gopage

before:
  hooks:
    - go mod download

builds:
  - id: gopage
    main: ./cmd/gopage
    binary: gopage
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.module={{ envOrDefault "GOPAGE_MODULE" (printf "v%s" .Version) }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: gopage
    ids: [gopage]
    name_template: "gopage_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - LICENSE-MIT
      - LICENSE-APACHE

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

snapshot:
  version_template: "nightly"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
  footer: |
    Verify what you downloaded:

    ```bash
    sha256sum --check checksums.txt --ignore-missing
    ```

    ```bash
    cosign verify-blob checksums.txt \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github\.com/apptivitypl/gopage/\.github/workflows/publish\.yml@.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
